# Local development compose file — used automatically by Spring Boot Docker Compose support.
# Spring Boot starts these services when bootRun is executed and stops them on shutdown.
services:
  postgres:
    image: ghcr.io/jdellostritto/template-db-postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      SAMPLE_DB_USER: appuser
      SAMPLE_DB_PASSWORD: apppass
      SAMPLE_DB_DATABASE: appdb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
