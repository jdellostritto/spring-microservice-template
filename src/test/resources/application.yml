spring:
  profiles:
    active: test
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# Disable Kafka producer in tests - no broker available
kafka:
  producer:
    enabled: false

# Disable OpenTelemetry SDK in tests - prevents AbstractMethodError from
# OTel version mismatch in the Logback bridge
otel:
  sdk:
    disabled: true

# Enable OpenAPI in tests
springdoc:
  version: 0.0.1-SNAPSHOT
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Use separate management port in tests - matches production configuration
management:
  server:
    port: 9001
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus,livenessProbe,readinessProbe,groups

  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    diskSpace:
      enabled: true
