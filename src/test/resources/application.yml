spring:
  profiles:
    active: test
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  # H2 in-memory datasource — no postgres required for tests
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

# Disable Kafka producer in tests - no broker available
kafka:
  producer:
    enabled: false

# Disable OpenTelemetry SDK in tests - prevents AbstractMethodError from
# OTel version mismatch in the Logback bridge
otel:
  sdk:
    disabled: true

# Enable OpenAPI in tests
springdoc:
  version: 0.0.1-SNAPSHOT
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Use separate management port in tests - matches production configuration
management:
  server:
    port: 9001
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus,livenessProbe,readinessProbe,groups

  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    diskSpace:
      enabled: true
