# ===============================
# = Server Ports
# ===============================
server:
  port: 8700

# ===============================
# = Springdoc (Swagger/OpenAPI)
# ===============================
springdoc:
  version: 0.0.1-SNAPSHOT
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /test/index.html
    operationsSorter: method
  group-configs:
  - group: greeting-v1
    paths-to-match: /flip/**
    produces-to-match: application/vnd.flipfoundry.greeting.v1+json
    packages-to-scan: com.flipfoundry.tutorial.application.web.controller
  - group: departing-v1
    paths-to-match: /flip/**
    produces-to-match: application/vnd.flipfoundry.departing.v1+json
    packages-to-scan: com.flipfoundry.tutorial.application.web.controller
  - group: greeting-v2
    paths-to-match: /flip/**
    produces-to-match: application/vnd.flipfoundry.greeting.v2+json
    packages-to-scan: com.flipfoundry.tutorial.application.web.controller

# ===============================
# = Actuator / Health Probes
# ===============================
management:
  server:
    port: 9001
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus,livenessProbe,readinessProbe,groups

  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
    tags:
      application: ${spring.application.name}
      profile: ${spring.profiles.active:default}

# ===============================
# = OpenTelemetry - Disabled by default
# ===============================
otel:
  sdk:
    disabled: true

