# ===============================
# = Spring Doc - Disabled for Production
# ===============================
springdoc:
  swagger-ui:
    enabled: false

# ===============================
# = Actuator / Health Probes - Production Overrides
# ===============================
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,livenessProbe,readinessProbe

  endpoint:
    health:
      show-details: never

  health:
    diskSpace:
      enabled: false
    db:
      enabled: false
    kafka:
      enabled: false

# ===============================
# = OpenTelemetry - Enabled for Production
# ===============================
otel:
  sdk:
    disabled: false
  exporter:
    otlp:
      protocol: grpc
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
  traces:
    exporter: otlp
  metrics:
    exporter: otlp
  logs:
    exporter: otlp
  resource:
    attributes:
      'service.name': ${OTEL_SERVICE_NAME}
      'service.version': ${APP_VERSION}
  instrumentation:
    logback-appender:
      enabled: true
    micrometer:
      enabled: true

# ===============================
# = Kafka - Enabled for Production
# ===============================
spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

  # ===============================
  # = Database - Production overrides
  # ===============================
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

kafka:
  producer:
    enabled: true
